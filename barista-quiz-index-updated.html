<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>바리스타 2급 예상문제</title><style>
:root{color-scheme:light;--bg:#f3f5f8;--card:#fff;--ink:#182230;--muted:#687386;--line:#e2e7ee;--accent:#1769e0;--good:#16834a;--bad:#d33b42}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}header{background:#111827;color:#fff;padding:22px 18px 18px}header h1{font-size:21px;margin:0 0 6px}header p{margin:0;color:#c5ceda;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.pill{font-size:12px;background:#e8eef8;color:#31527c;padding:7px 10px;border-radius:30px}.progress{height:7px;background:#e1e6ee;border-radius:9px;overflow:hidden;margin:10px 0 16px}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 17px;box-shadow:0 5px 20px #18223008}.qmeta{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:12px}.question{font-size:19px;line-height:1.55;font-weight:750;margin:0 0 14px;word-break:keep-all}.note{font-size:14px;color:#344256;background:#f5f7fa;border:1px solid #e3e9f1;border-radius:12px;padding:12px 13px;line-height:1.75;margin:0 0 14px;white-space:pre-line}.note:before{content:"보기";display:block;font-size:12px;font-weight:800;color:#1769e0;margin-bottom:4px}.options{display:grid;gap:9px}.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 12px;font:inherit;color:inherit;line-height:1.45;cursor:pointer}.opt:focus-visible,button:focus-visible{outline:3px solid #8bb8ff;outline-offset:2px}.opt.selected{border-color:var(--accent);background:#edf4ff}.letter{flex:0 0 25px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#eef1f5;font-size:13px;font-weight:700}.selected .letter{background:var(--accent);color:#fff}.feedback{margin-top:14px;border-radius:12px;padding:12px;font-size:14px;line-height:1.5}.correct{background:#eaf7ef;color:#12683a}.wrong{background:#fff0f0;color:#a62a31}.actions{display:flex;gap:8px;margin-top:16px}.btn{border:0;border-radius:12px;padding:13px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white;flex:1}.secondary{background:#edf0f4;color:#354052}.btn:disabled{opacity:.4;cursor:not-allowed}.bottom{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:12px 2px}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}.grid button{aspect-ratio:1;border:1px solid var(--line);background:white;border-radius:8px;font-size:12px;color:#465266}.grid button.done{background:#eaf1ff;border-color:#9bbcf2;color:#174f9f}.grid button.current{outline:2px solid var(--accent)}.grid button.correctQ{background:#e8f7ed;border-color:#9ed8b3}.grid button.wrongQ{background:#fff0f0;border-color:#efb1b4}.result{text-align:center;padding:24px 8px}.score{font-size:48px;font-weight:850;color:var(--accent);margin:8px}.small{color:var(--muted);font-size:13px}.hidden{display:none!important}.reviewitem{padding:14px 0;border-bottom:1px solid var(--line);line-height:1.5}.reviewitem strong{display:block;margin-bottom:5px}.reviewitem .ans{font-size:13px;color:var(--muted)}footer{text-align:center;color:#8a94a4;font-size:11px;margin-top:22px}@media(min-width:600px){.wrap{padding-top:24px}.card{padding:26px}.question{font-size:21px}.opt{padding:15px}}

const QUESTIONS=[{"n": 1, "q": "평가시간에 응시자가 조리하는 커피는?", "opts": ["가, 나", "나, 라", "가, 다", "가, 라", "가, 나, 라"], "a": 1, "note": "보기: 가 아메리카노 / 나 카푸치노 / 다 마끼아또 / 라 에스프레소"}, {"n": 2, "q": "커피조리 종사자에 대한 설명이 틀린 것은?", "opts": ["정기건강진단으로 건강관리 문제점을 조기에 발견하고 처치한다.", "화농성 질환에 이환되면 완치될 때까지 조리업무를 못한다.", "소화기계 질환의 보균자는 조리업무를 수행할 수 있다.", "임시건강진단은 필요시 수시로 실시한다.", "예방접종을 받아야 한다."], "a": 2, "note": ""}, {"n": 3, "q": "로부스타의 설명으로 틀린 것은?", "opts": ["재배지역은 고온다습, 24~30도 재배가 가능하다.", "원산지는 19세기 발견된 콩고이다.", "고도 700m 이하도 재배가 가능하다.", "뿌리가 깊어 땅이 척박해도 잘 자란다.", "병충해에 강하다."], "a": 3, "note": ""}, {"n": 4, "q": "커피 조리사의 조리 준비 자세로서 적당하지 않은 것은?", "opts": ["팔소매에 레이스가 없는 옷을 착용한다.", "손톱이 길면 안 된다.", "커피 향과 어울리는 향수를 사용한다.", "깨끗한 앞치마를 착용한다.", "헤어스타일은 단정하게 정리한다."], "a": 4, "note": ""}, {"n": 5, "q": "커피콩의 로스팅 과정 나열이 바른 것을 고르시오.", "opts": ["ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ", "ㄱ, ㄴ, ㄹ, ㄷ, ㅁ, ㅂ", "ㄱ, ㄴ, ㄷ, ㄹ, ㅂ, ㅁ", "ㄱ, ㄴ, ㄹ, ㅁ, ㄷ, ㅂ", "ㄱ, ㄴ, ㅁ, ㄹ, ㄷ, ㅂ"], "a": 0, "note": "보기: ㄱ 예열과정 / ㄴ 투입 / ㄷ 흡열과정 / ㄹ 1차 수분 날리기 / ㅁ 2차 팝핑 / ㅂ 배출하여 쿨링"}, {"n": 6, "q": "볶은 커피의 산화에 대한 설명 중 틀린 내용은?", "opts": ["홀빈보다 분쇄커피가 훨씬 빨리 나타난다.", "개봉 후는 빠르게 향기가 휘발하고 산화된다.", "냉장 온도에서는 산패가 진행되지 않는다.", "가장 중요한 요인은 산소와 수분, 온도, 빛 등이다.", "강하게 볶은 커피에서 더 빨리 진행된다."], "a": 2, "note": ""}, {"n": 7, "q": "실기심사 2번 공간에 기본적으로 준비되어 있어야 하는 것은?", "opts": ["가, 나, 다", "가, 다", "나, 라", "라", "가, 나, 다, 라"], "a": 4, "note": "보기: 가 에스프레소 커피기계 / 나 에스프레소 커피그라인더 / 다 작은 냉장고 / 라 우유 데우기용 피처 2개"}, {"n": 8, "q": "로스팅 할 때 약·중 볶음에서 커피의 기분 좋은 쓴맛을 내는 성분은?", "opts": ["퀸닉산", "페놀복합체", "카페인산", "클로로겐산", "비닐카페놀중합체"], "a": 3, "note": ""}, {"n": 9, "q": "아라비카 종이 아닌 품종은?", "opts": ["버본", "카네포라", "카투라", "문도노보", "티피카"], "a": 1, "note": ""}, {"n": 10, "q": "에스프레소 머신의 역사 설명 중 틀린 것은?", "opts": ["1855년 산타이스가 파리 박람회에서 금속 필터를 사용한 모카포트를 개발하여 선보였다.", "1901년 베제라가 이태리 밀라노에서 증기압을 이용한 기계를 발명, 특허출원했다.", "1905년 베제라의 특허권으로 라파보니가 물을 88~96도, 압력 7~10Bar로 개선하였다.", "1938년 시모넬리는 고온의 스팀압이 아닌 피스톤 펌프를 개발하여 커피의 신맛, 쓴맛을 감소시켰다.", "1945년 가찌아는 지금과 같은 에스프레소 기계를 만들어 9기압으로 추출해 크레마를 선보였다."], "a": 0, "note": ""}, {"n": 11, "q": "그라인딩 굵기의 순서로 알맞은 것은? (얇다 < 굵다)", "opts": ["이브릭 < 콜드브루 < 모카포트", "에스프레소 < 모카포트 < 사이폰 < 핸드드립", "모카포트 < 드립 < 이브릭 < 프렌치프레스", "콜드브루 < 모카포트 < 프렌치프레스", "사이폰 > 드립 < 터키쉬 < 프렌치프레스"], "a": 1, "note": ""}, {"n": 12, "q": "카페인을 과량 섭취한 경우 중추신경에 작용되어 나타나는 증상이 아닌 것은?", "opts": ["불안", "신경과민", "숙면", "초조", "흥분"], "a": 2, "note": ""}, {"n": 13, "q": "포터필터 바스켓에 담긴 분쇄커피를 다질 때 틀린 것은?", "opts": ["분쇄커피는 한쪽으로 쌓이지 않게 밀도 있게 담아야 한다.", "포터필터 전용 크기의 탬퍼를 사용하는 것이 좋다.", "커피가 기울어지면 탬퍼로 포터필터를 쳐서 균형을 맞춰준다.", "탬퍼 밑면은 수평으로 포터필터에 삽입되어야 한다.", "탬핑할 때 한쪽으로 기울어지지 않도록 바 상단에 직각으로 고정한다."], "a": 2, "note": ""}, {"n": 14, "q": "동네의원에 내원한 환자가 식중독으로 진단되면 담당의사가 보고해야 하는 곳은?", "opts": ["군수", "시장", "도지사", "보건소장", "보건복지부장관"], "a": 4, "note": ""}, {"n": 15, "q": "HACCP에서 'HA'에 대한 설명이 옳은 것은?", "opts": ["위해 가능성이 있는 요소를 찾아서 분석하고 평가한다.", "위해 요소를 찾아서 상급기관에 보고한다.", "위해 요소를 방지하고 제거한다.", "위해 요소로부터 안정성을 확보한다.", "위해 요소로부터 건전성을 확보한다."], "a": 0, "note": ""}, {"n": 16, "q": "증기나 물의 압력을 이용하여 에스프레소 커피를 추출하는 기계를 제작하고 보급했던 최초 국가는?", "opts": ["이탈리아", "프랑스", "네덜란드", "영국", "스웨덴"], "a": 0, "note": ""}, {"n": 17, "q": "그룹헤드의 청소에 대한 설명으로 틀린 것은?", "opts": ["포터필터에 블라인더 필터를 장착한다.", "전용세제는 막힌 포터필터에 넣는다.", "추출 연속버튼을 작동하여 5~10초 후 멈추면서 여러 번 확인한다.", "그룹헤드를 역류한 세제 물은 온수 보일러실로 유입된다.", "솔레노이드밸브를 통과한 세제 물은 드레인박스로 흐른다."], "a": 3, "note": ""}, {"n": 18, "q": "커피(원두) 보관 방법에 적합한 것은?", "opts": ["가, 다, 라", "가, 다", "다, 라", "나, 라", "가, 라"], "a": 0, "note": "보기: 가 직사광선 피하기 / 나 오래 보관할 시 냉동 보관 / 다 밀폐 용기 / 라 습기 많은 곳 피하기"}, {"n": 19, "q": "커피 가공방식에 따른 그린빈의 특징에 대한 설명으로 옳지 않은 것은?", "opts": ["습식건조커피는 자연건조커피에 비해 단맛이 감소되고 신맛이 증가된다.", "습식가공커피는 비교적 균일하고 결점 비율이 낮다.", "단맛의 강도는 자연건조 방식이 습식건조 방식보다 높다.", "자연건조커피는 흙냄새와 발효냄새가 난다.", "습식가공법은 대량생산이 가능하며 친환경적인 방법이다."], "a": 4, "note": ""}, {"n": 20, "q": "바리스타 실기 2급 평가 시 심사위원의 평가기준 항목이 아닌 것은?", "opts": ["그라인더 커피 입자 조절능력", "일관된 담기와 다지기", "적절한 에스프레소 추출량과 시간", "우유거품의 양, 질감, 온도", "조리시간 동안의 전반적인 위생"], "a": 0, "note": ""}, {"n": 21, "q": "로스팅 과정 설명 중에 틀린 것은?", "opts": ["흡열과정에서 생두는 엘로우, 연두빛을 띤다.", "2차 크랙은 원두가 팽창하며 팝콘 튀는 소리를 내며 이를 팝핑이라고도 한다.", "휴지기 발열 과정에 레소가 첨가되어 제공되지 않는 메뉴는?", "opts": ["카라멜 마끼아또", "카페 콘파나", "초콜릿 프라프치노", "카페 프레도", "샤케라또"], "a": 2, "note": ""}, {"n": 32, "q": "생두 로스팅 시 화학·물리적 변화 중 맞는 것은?", "opts": ["가, 나, 다", "나, 다, 라", "나, 라", "가, 라", "가, 나, 다, 라, 마"], "a": 4, "note": "보기: 가 로스팅 후 수분함량은 1% 이하로 변한다 / 나 부피는 2~2.5배 늘어난다 / 다 갈색으로 변화하는 캐러멜 현상 / 라 유기성 성분 손실로 CO₂ 방출은 로스팅 후에도 일정기간 지속 / 마 휘발성 성분은 시티~풀시티에서 생성보다 손실"}, {"n": 33, "q": "에스프레소 리스트레또의 크레마 색깔은?", "opts": ["연한 갈색", "갈색", "진한 갈색", "황금색", "황갈색"], "a": 2, "note": ""}, {"n": 34, "q": "스팀된 최적의 우유 온도와 에스프레소 추출용 투입되는 최적의 물 온도는?", "opts": ["우유 - 약 50℃ 이하", "우유 - 약 60℃ 이하", "우유 - 약 85℃ 이상", "에스프레소 - 약 75~85℃", "에스프레소 - 약 90℃ 전후"], "a": 4, "note": ""}, {"n": 35, "q": "영양결핍에 의한 생육으로 체리에 한 개의 콩이 들어있다면, 이 콩을 무엇이라 하는가?", "opts": ["피베리(Peaberry)", "모노빈(Mono-Bean)", "싱글빈(Single Bean)", "소이빈(Soy Bean)", "트와이스(Twice)"], "a": 0, "note": ""}, {"n": 36, "q": "식기류의 소독조건이 옳은 것은?", "opts": ["가, 나, 다", "가, 다", "나, 라", "라", "가, 나, 다, 라"], "a": 0, "note": "보기: 가 100℃ 물에 완전히 잠기도록 하여 3분 이상 / 나 100℃ 증기에 15분 이상 / 다 80℃ 열풍에 30분 이상 / 라 차아염소산나트륨 0.3~0.5% 용액에 10분간 담그기"}, {"n": 37, "q": "증기압을 사용하여 에스프레소 머신 개발에 가장 큰 영향을 준 커피 추출기구는?", "opts": ["이브릭", "모카포트", "더치커피", "프렌치프레스", "융드립"], "a": 1, "note": ""}, {"n": 38, "q": "커피 회사들이 블렌딩(Blending)하는 이유는?", "opts": ["가, 나", "가, 다, 라", "나, 라", "가, 나, 다", "라"], "a": 3, "note": "보기: 가 맛의 밸런스와 풍부한 풍미 / 나 원가 절감 / 다 고유의 브랜드 이미지 구축 / 라 특정 지역 빈 독점"}, {"n": 39, "q": "커피콩을 등급화하기 위하여 스크린을 한 번에 통과시키는 커피의 양은?", "opts": ["50g", "100g", "150g", "200g", "250g"], "a": 1, "note": ""}, {"n": 40, "q": "일반적인 기준하의 에스프레소 설명으로 틀린 것은?", "opts": ["리스트레또 < 에스프레소 < 룽고 순으로 추출량과 시간이 길어진다.", "추출수 온도가 높으면 추출가용성분이 20% 이상으로 과다추출되어 쓴맛이 난다.", "에스프레소는 1샷 기준 7g 내외, 30ml 내외, 30초 내외 추출된 커피이다.", "에스프레소는 이태리어로 '농축하다'이다.", "에스프레소 두 잔을 합친 것을 도피오, 더블이라고 한다."], "a": 3, "note": ""}, {"n": 41, "q": "우유를 데워주는 스팀노즐에 대한 설명으로 틀린 것은?", "opts": ["스팀 사용 뒤 노즐 안의 우유를 빼줘야 다음 잔 맛에 영향을 주지 않는다.", "우유거품은 스팀의 뜨거운 공기와 우유 표면 주변 공기를 빨아들여 거품을 낸다.", "스팀노즐은 사용 후 차가운 행주로 세척해준다.", "온수를 많이 사용해도 스팀의 온도는 변동 없다.", "스팀 let answers=JSON.parse(localStorage.getItem('barista_answers')||'{}'),
checked=JSON.parse(localStorage.getItem('barista_checked')||'{}'),idx=0;
const $=id=>document.getElementById(id),letters=['①','②','③','④','⑤'];
function save(){
 localStorage.setItem('barista_answers',JSON.stringify(answers));
 localStorage.setItem('barista_checked',JSON.stringify(checked));
}
function render(){
 const q=QUESTIONS[idx];
 $('qmeta').textContent=`QUESTION ${String(q.n).padStart(2,'0')}`;
 $('question').textContent=q.q;
 $('note').textContent=q.note.replace(/^보기:\\s*/, '');
 $('note').classList.toggle('hidden',!q.note);
 $('options').innerHTML='';
 q.opts.forEach((o,j)=>{
  const b=document.createElement('button');
  b.className='opt'+(answers[idx]===j?' selected':'');
  b.innerHTML=`<span class="letter">${letters[j]}</span><span></span>`;
  b.lastChild.textContent=o;
  b.onclick=()=>{
   answers[idx]=j;
   delete checked[idx];
   save();
   render();
  };
  $('options').append(b);
 });
 $('answered').textContent=`${Object.keys(answers).length} / 50 응답`;
 $('bar').style.width=`${Object.keys(answers).length/50*100}%`;
 $('position').textContent=`${idx+1} / 50`;
 $('prev').disabled=idx===0;
 $('next').textContent=idx===49?'마지막 문제':'다음';
 $('check').disabled=answers[idx]===undefined;
 $('grid').innerHTML='';
 QUESTIONS.forEach((q,k)=>{
  const b=document.createElement('button');
  b.textContent=k+1;
  if(answers[k]!==undefined)b.classList.add('done');
  if(k===idx)b.classList.add('current');
  if(checked[k]!==undefined)b.classList.add(checked[k]?'correctQ':'wrongQ');
  b.onclick=()=>{idx=k;render()};
  $('grid').append(b);
 });
 showFeedback();
}
function showFeedback(){
 const q=QUESTIONS[idx], f=$('feedback');
 if(checked[idx]===undefined){f.className='hidden';f.textContent='';return;}
 const ok=checked[idx];
 f.className='feedback '+(ok?'correct':'wrong');
 f.textContent=ok
  ? `정답입니다! ${letters[q.a]} ${q.opts[q.a]}`
  : `오답입니다. 정답은 ${letters[q.a]} ${q.opts[q.a]} 입니다.`;
}
$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};
$('next').onclick=()=>{idx=Math.min(49,idx+1);render()};
$('check').onclick=()=>{
 if(answers[idx]===undefined)return;
 checked[idx]=answers[idx]===QUESTIONS[idx].a;
 save();render();
};
render();
</script></body></html>
